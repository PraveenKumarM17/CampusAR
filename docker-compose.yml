services:
  db:
    image: postgis/postgis:16-3.4
    container_name: campusar-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-campusar}
    ports:
      - '5433:5432'
    volumes:
      - campusar_pgdata:/var/lib/postgresql/data
      - ./apps/api/src/infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./apps/api/src/infrastructure/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-campusar} -d ${POSTGRES_DB:-campusar}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: campusar-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-campusar}:${POSTGRES_PASSWORD:-campusar_secret}@db:5432/${POSTGRES_DB:-campusar}
      API_PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars!}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NODE_ENV: production
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: campusar-web
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  campusar_pgdata:
