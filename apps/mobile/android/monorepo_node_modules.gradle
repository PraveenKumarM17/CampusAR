/**
 * npm workspaces hoist dependencies to the repo root. React Native's default Gradle
 * paths assume node_modules lives under apps/mobile — resolve both layouts.
 */

ext.campusArResolveNodeModulesDir = { File androidDir ->
    def candidates = [
        new File(androidDir, "../node_modules"),
        new File(androidDir, "../../../node_modules"),
    ]
    for (def dir in candidates) {
        if (new File(dir, "react-native").exists()) {
            return dir
        }
    }
    throw new GradleException(
        "Could not find react-native in node_modules. From the repo root run: npm install",
    )
}

ext.campusArReactNativeGradlePluginDir = { File androidDir ->
    def nodeModules = campusArResolveNodeModulesDir(androidDir)
    def plugin = new File(nodeModules, "@react-native/gradle-plugin")
    if (!plugin.exists()) {
        throw new GradleException(
            "Missing ${plugin.path}. From the repo root run: npm install",
        )
    }
    return plugin
}
