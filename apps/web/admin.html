<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#eef1f3" />
    <title>CampusAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      .admin-map-pin {
        background: transparent !important;
        border: none !important;
      }

      .admin-pin-dot {
        width: 22px;
        height: 22px;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        border: 2px solid #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }

      .admin-bend-pin {
        cursor: pointer !important;
      }

      .admin-bend-dot {
        width: 18px;
        height: 18px;
        margin: 7px;
        border-radius: 50%;
        background: #f59e0b;
        border: 2px solid #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        pointer-events: auto;
      }

      .admin-bend-dot-selected {
        background: #c2410c;
        width: 20px;
        height: 20px;
        margin: 6px;
        box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.35);
      }

      .admin-map-tooltip {
        background: rgba(255, 255, 255, 0.95) !important;
        color: #1f2937 !important;
        border: 1px solid rgba(0, 0, 0, 0.12) !important;
        border-radius: 6px !important;
        padding: 5px 8px !important;
        font-size: 12px !important;
        font-weight: 600 !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2) !important;
      }

      .admin-map-tooltip::before {
        border-top-color: rgba(255, 255, 255, 0.95) !important;
      }
    </style>
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
