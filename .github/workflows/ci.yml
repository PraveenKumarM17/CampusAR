name: CI

on:
  push:
    branches: [main, mvp, develop]
  pull_request:
    branches: [main, mvp, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: campusar
          POSTGRES_PASSWORD: campusar_secret
          POSTGRES_DB: campusar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusar -d campusar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate & seed
        env:
          DATABASE_URL: postgresql://campusar:campusar_secret@localhost:5432/campusar
        run: |
          PGPASSWORD=campusar_secret psql -h localhost -U campusar -d campusar -f apps/api/src/infrastructure/db/schema.sql
          PGPASSWORD=campusar_secret psql -h localhost -U campusar -d campusar -f apps/api/src/infrastructure/db/seed.sql
          npm run db:seed -w @campusar/api

      - name: Test
        env:
          DATABASE_URL: postgresql://campusar:campusar_secret@localhost:5432/campusar
          JWT_ACCESS_SECRET: test-access-secret-min-32-characters!!
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-characters!
          API_PORT: 4000
          CORS_ORIGIN: http://localhost:5173
          NODE_ENV: test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Docker nginx /api and /ws proxy
        run: node scripts/test-docker-proxy.mjs
